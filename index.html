<html lang="cs"><head><meta charset="utf-8">

<title>Poznávačka – cvičení ze zoologie</title>
<style>
:root{--bg:#f3f6f4;--sf:#fff;--tx:#14231c;--mu:#5d6f66;--ac:#0f9d77;--ac2:#0b7a5c;--bd:#dde6e1;--ok:#1f9d55;--no:#d64545;--sh:0 10px 30px rgba(20,60,45,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--sf:#17221c;--tx:#e8f2ec;--mu:#8fa398;--ac:#2dd4a3;--ac2:#5eead4;--bd:#273830;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1612;--sf:#17221c;--tx:#e8f2ec;--mu:#8fa398;--ac:#2dd4a3;--ac2:#5eead4;--bd:#273830;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
.w{position:relative;z-index:0;max-width:1100px;margin:0 auto;padding:14px 14px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0}h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--mu)}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tab,.chip,.tg{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px;font-size:.88rem;transition:.15s}
.tab.on,.chip.on,.tg.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.chips{margin:8px 0}.secs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.secs,.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:6px}.secs>*,.chips>*{flex:none;white-space:nowrap}
@media(max-width:700px){h1 small{display:none}h1{font-size:1.1rem}.w{padding:10px 10px 30px}.sc{padding:6px 11px}}.sc{border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 14px;font-size:.9rem;font-weight:600;transition:.15s}.sc.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}.sc i,.chip i{font-style:normal;font-weight:400;opacity:.7;margin-left:5px}
.sel{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;max-width:100%;min-width:260px}.chip.nq{border-style:dashed}
#notes details{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px 14px;margin:4px 0 8px;font-size:.9rem}#notes summary{cursor:pointer;font-weight:600}#notes h4{margin:10px 0 2px;font-size:.92rem}#notes ul{margin:2px 0 6px;padding-left:20px}
.grp{margin-top:4px;font-size:.9rem;color:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.prog{flex:1;min-width:140px;height:8px;background:var(--bd);border-radius:9px;overflow:hidden;display:flex}
.prog b{display:block;height:100%;transition:.3s}.prog .k{background:var(--ok)}.prog .n{background:var(--no)}
.st{font-size:.85rem;color:var(--mu)}
/* kartička */
.scene{perspective:1600px;height:var(--sh-h,62vh);min-height:340px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);padding:18px 20px;overflow:auto;-webkit-overflow-scrolling:touch;cursor:pointer}
.hint{padding:8px 12px;font-size:.84rem;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd)}
.flipb{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:5px 12px;font-weight:600;font-size:.85rem}
/* galerie obrázků jednoho zástupce */
.gal{flex:1;min-height:0;display:grid;gap:4px;padding:4px;background:var(--bd);overflow:auto;-webkit-overflow-scrolling:touch;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:minmax(var(--mh,96px),1fr)}
.ci{position:relative;display:block;background:#fff;border:0;padding:0;border-radius:10px;overflow:hidden;min-height:0}
.ci img{position:absolute;left:3px;top:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;display:block}
.ci .nm,.ci .zm{position:absolute;font-size:.72rem;line-height:1;background:rgba(10,20,15,.6);color:#fff;border-radius:6px;padding:4px 6px;pointer-events:none}
.ci .nm{left:6px;top:6px}.ci .zm{right:6px;bottom:6px;opacity:.8}
.ci:hover{outline:2px solid var(--ac);outline-offset:-2px}
/* rub */
.back .top{display:flex;gap:14px;align-items:center}
.back h2{margin:0;font-size:1.5rem;line-height:1.2}.back em{color:var(--ac2);font-size:1.05rem}
.back ul{margin:12px 0 0;padding-left:20px}.back li{margin:3px 0}
.th{width:84px;height:84px;flex:none}
.th .ci{width:100%;height:100%;border:1px solid var(--bd)}
.caps{margin-top:16px;border-top:1px solid var(--bd);padding-top:10px}
.caps h3{margin:0 0 8px;font-size:.95rem;color:var(--mu);font-weight:600}
.cap{display:flex;gap:10px;align-items:center;margin:0 0 8px;font-size:.9rem}
.cap .ci{width:64px;height:64px;flex:none;border:1px solid var(--bd)}
.cap small{display:block;color:var(--mu)}
.note{margin-top:12px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,transparent);font-size:.92rem}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.b{border:1px solid var(--bd);background:var(--sf);padding:11px 18px;border-radius:14px;font-weight:600;min-width:88px}
.b:hover{border-color:var(--ac)}.b.no{color:var(--no)}.b.ok{color:var(--ok)}
.b:disabled{opacity:.4;cursor:default}
.kb{text-align:center;color:var(--mu);font-size:.78rem;margin-top:12px}
@media(hover:none){.kb{display:none!important}}
@media(max-width:520px){.ctl{flex-wrap:nowrap;gap:6px}.ctl .b{flex:1;min-width:0;padding:11px 6px;font-size:.92rem}}
/* test */
.q{background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.q .gal{flex:none;height:var(--qh,46vh);min-height:240px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.o{border:1px solid var(--bd);background:var(--bg);border-radius:14px;padding:12px;text-align:left}
.o:hover:not(:disabled){border-color:var(--ac)}.o.good{background:var(--ok);color:#fff;border-color:var(--ok)}.o.bad{background:var(--no);color:#fff;border-color:var(--no)}
.fb{padding:0 14px 14px}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
/* zvětšení obrázku */
.lb{position:fixed;inset:0;z-index:50;background:#070d0a;color:#fff;display:flex;transform:translateZ(0);flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.lb[hidden]{display:none}
.lb .tb{display:flex;align-items:center;gap:8px;padding:10px 12px}
.lb .tb .cnt{flex:1;font-size:.95rem;opacity:.85}
.lb .lbb{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-size:1.15rem;font-weight:600}
.lb .vw{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;position:relative}
.lb .vw img{margin:auto;max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px;display:block}
.lb .vw.z img{max-width:none;max-height:none;width:calc(var(--z)*100%);height:auto;border-radius:0}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.6rem;z-index:2}
.lb .pv{left:8px}.lb .nx{right:8px}
.lb .lc{padding:10px 16px 14px;font-size:.95rem;min-height:1.5em;text-align:center}
.lb .lc em{color:#9ff0d4}.lb .lc small{display:block;opacity:.8}
.lb .dots{display:flex;gap:6px;justify-content:center;padding-bottom:10px;flex-wrap:wrap}
.lb .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}.lb .dots i.on{background:#fff}
</style></head><body><div class="w">

let mode='c',sec=D.secs[0].k,org='all',shuf=false,unk=false,i=0,flip=false,deck=[],st={},qa=null,score={r:0,t:0};
try{st=JSON.parse(localStorage.getItem('prot_z')||'null')||null}catch(e){st=null}
if(!st){st={};try{const old=JSON.parse(localStorage.getItem('prot')||'{}');D.cards.forEach(c=>{const v=c.im.map(x=>old[x.i]);if(v.includes('n'))st[c.o]='n';else if(v.length&&v.every(x=>x=='k'))st[c.o]='k'})}catch(e){}}
const save=()=>{try{localStorage.setItem('prot_z',JSON.stringify(st))}catch(e){}};
const secOf=c=>D.orgs[c.o].sec;
const inSec=c=>sec=='all'||secOf(c)==sec;
const secOrgs=()=>D.cards.map(c=>c.o).filter(k=>sec=='all'||D.orgs[k].sec==sec);
const isNq=c=>!!D.orgs[c.o].nq;
const orgOk=c=>org=='all'||(org.startsWith('g:')?D.orgs[c.o].g==org.slice(2):c.o==org);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const pl=n=>n+' '+(n==1?'obrázek':n<5?'obrázky':'obrázků');
const nImg=k=>D.cards.find(c=>c.o==k).im.length;
try{const v=localStorage.getItem('prot_sec');if(v&&(v=='all'||D.secs.some(x=>x.k==v)))sec=v}catch(e){}
function build(){
  let d=D.cards.filter(c=>inSec(c)&&orgOk(c)&&(!unk||st[c.o]!='k')&&!(mode=='q'&&isNq(c)));
  if(shuf){d=d.map(c=>[Math.random(),c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
  deck=d;i=Math.min(i,Math.max(d.length-1,0));flip=false;qa=null;render();
}
function chips(){
  $('#secs').innerHTML=[...D.secs,{k:'all',n:'Všechny prezentace'}].map(x=>{
    const n=x.k=='all'?D.cards.length:D.cards.filter(c=>secOf(c)==x.k).length;
    return `<button class="sc ${sec==x.k?'on':''}" data-s="${x.k}">${x.n}<i>${n}</i></button>`}).join('');
  const ks=secOrgs(),tot=ks.length;
  if(ks.length>40){
    const gs=[];ks.forEach(k=>{const g=D.orgs[k].g||'ostatní';if(!gs.includes(g))gs.push(g)});
    let h=`<select class="sel" id="osel"><option value="all">Vše v sekci (${tot})</option>`;
    gs.forEach(g=>{const gk=ks.filter(k=>(D.orgs[k].g||'ostatní')==g);
      h+=`<optgroup label="${esc(g)}"><option value="g:${esc(g)}">▸ celá skupina (${gk.length})</option>`+gk.map(k=>`<option value="${k}">${esc(D.orgs[k].cz)}${D.orgs[k].nq?' · znaky':''} (${pl(nImg(k))})</option>`).join('')+'</optgroup>'});
    $('#chips').innerHTML=h+'</select>';$('#osel').value=org;$('#osel').onchange=e=>{org=e.target.value;i=0;build()};
  }else{
    $('#chips').innerHTML=['all',...ks].map(k=>{
      const n=k=='all'?tot:nImg(k);
      return `<button class="chip ${org==k?'on':''} ${k!='all'&&D.orgs[k].nq?'nq':''}" data-o="${k}" title="${k=='all'?tot+' kartiček':(D.orgs[k].nq?'obecné znaky – jen v kartičkách · ':'')+pl(n)}">${k=='all'?'Vše':D.orgs[k].cz}<i>${n}</i></button>`}).join('');
  }
  requestAnimationFrame(()=>document.querySelectorAll('.sc.on,.chip.on').forEach(b=>{const r=b.parentNode;r.scrollLeft=b.offsetLeft-r.offsetLeft-20}));
  const ns=sec=='all'?[]:(D.notes[sec]||[]);
  $('#notes').innerHTML=ns.length?`<details ${window.nOpen?'open':''} ontoggle="window.nOpen=this.open"><summary>Text ze slidů bez obrázků (${ns.length})</summary>${ns.map(n=>`<h4>${n.h}</h4><ul>${n.b.map(t=>`<li>${t}</li>`).join('')}</ul>`).join('')}</details>`:'';
}
function prog(){
  const l=deck.length,k=deck.filter(c=>st[c.o]=='k').length,n=deck.filter(c=>st[c.o]=='n').length;
  $('#pg').innerHTML=`<b class="k" style="width:${l?k/l*100:0}%"></b><b class="n" style="width:${l?n/l*100:0}%"></b>`;
  $('#st').textContent=mode=='c'?(l?`${i+1} / ${l} · znám ${k}`:'0 karet'):`Skóre ${score.r} / ${score.t}`;
}
/* rozložení mřížky podle počtu obrázků a poměru stran plochy */
function grid(n,W,H){
  let best=1,bs=-1;
  for(let c=1;c<=Math.min(n,6);c++){const r=Math.ceil(n/c),cw=W/c,ch=H/r,s=Math.min(cw,ch*1.25)-(c*r-n)*4;if(s>bs){bs=s;best=c}}
  return best;
}
const tile=(c,j,cls='')=>`<button class="ci ${cls}" data-z="${j}" aria-label="Zvětšit obrázek ${j+1}"><img data-i="${c.im[j].i}" src="${SRC(c.im[j].i)}" alt="" decoding="async">${c.im.length>1&&!cls?`<span class="nm">${j+1}/${c.im.length}</span>`:''}${cls?'':'<span class="zm">⤢</span>'}</button>`;
function gal(c,H){
  const W=Math.max(280,$('#main').clientWidth-10),n=c.im.length,cols=grid(n,W,H),mh=n>9?(W<600?80:110):96;
  return `<div class="gal" style="--c:${cols};--mh:${mh}px">${c.im.map((x,j)=>tile(c,j)).join('')}</div>`;
}
const capOf=(c,x)=>{const o=D.orgs[c.o],sp=(x.cz!=o.cz||x.la!=o.la);return {sp,t:(sp?`<b>${esc(x.cz)}</b> <em>${esc(x.la)}</em>`:'')+(x.note?(sp?'<small>':'')+x.note+(sp?'</small>':''):'')}};
function sceneH(){const vh=window.innerHeight,top=$('#main').getBoundingClientRect().top+window.scrollY;return Math.max(340,Math.min(vh-top-78,900))}
function render(){
  chips();$('#kb').style.display=mode=='c'?'':'none';
  const m=$('#main');
  if(!deck.length){m.innerHTML='<div class="empty">Žádné karty k zobrazení. Zkus změnit filtr nebo vynulovat postup.</div>';prog();return}
  const c=deck[i],o=D.orgs[c.o];
  if(mode=='c'){
    const s=st[c.o],H=sceneH();
    const sp=[...new Set(c.im.filter(x=>x.cz!=o.cz||x.la!=o.la).map(x=>x.cz+' ('+x.la+')'))];
    const caps=c.im.map((x,j)=>[x,j,capOf(c,x)]).filter(z=>z[2].t);
    m.innerHTML=`<div class="scene" style="--sh-h:${H}px"><div class="card ${flip?'f':''}" id="cd">
    <div class="face front">${gal(c,H-50)}<div class="hint"><span>Co je na ${c.im.length>1?'obrázcích':'obrázku'}? · ${pl(c.im.length)}</span><button class="flipb" id="fl">Otočit ↻</button></div></div>
    <div class="face back"><div class="top"><div class="th">${tile(c,0,'t')}</div><div><h2>${o.cz}</h2><em>${o.la}</em>${sp.length?`<div class="grp">na obrázcích: ${sp.map(esc).join(', ')}</div>`:''}</div></div>
    <ul>${o.b.map(t=>`<li>${t}</li>`).join('')}</ul>
    ${caps.length?`<div class="caps"><h3>Popisky obrázků</h3>${caps.map(([x,j,cp])=>`<div class="cap">${tile(c,j,'t')}<div>${j+1}. ${cp.t}</div></div>`).join('')}</div>`:''}</div></div></div>
    <div class="ctl"><button class="b" id="pv">← Zpět</button><button class="b no" id="nn">${s=='n'?'✗ ':''}Nevím</button><button class="b ok" id="kk">${s=='k'?'✓ ':''}Znám</button><button class="b" id="nx">Další →</button></div>`;
    $('#cd').onclick=e=>{const z=e.target.closest('.ci');if(z){openLb(c,+z.dataset.z);return}doFlip()};
    $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#nn').onclick=()=>mark('n');$('#kk').onclick=()=>mark('k');
  }else{
    if(!qa){const G0=o.g;let pool=D.cards.map(x=>x.o).filter(k=>k!=c.o&&!D.orgs[k].nq&&D.orgs[k].sec==secOf(c));const pg=pool.filter(k=>G0&&D.orgs[k].g==G0);if(pg.length>=3&&Math.random()<.6)pool=pg;if(pool.length<3)pool=pool.concat(D.cards.map(x=>x.o).filter(k=>k!=c.o&&!D.orgs[k].nq&&D.orgs[k].sec!=secOf(c)).sort(()=>Math.random()-.5).slice(0,3-pool.length));const w=pool.sort(()=>Math.random()-.5).slice(0,3);qa={opts:[...w,c.o].sort(()=>Math.random()-.5),done:null}}
    const QH=Math.max(240,Math.min(window.innerHeight-$('#main').getBoundingClientRect().top-window.scrollY-(window.innerWidth<=520?330:200),640));
    const sp=[...new Set(c.im.filter(x=>x.cz!=o.cz||x.la!=o.la).map(x=>x.cz+' ('+x.la+')'))];
    m.innerHTML=`<div class="q" style="--qh:${QH}px">${gal(c,QH)}<div class="opts">${qa.opts.map(k=>`<button class="o ${qa.done?(k==c.o?'good':k==qa.done?'bad':''):''}" data-k="${k}" ${qa.done?'disabled':''}><b>${D.orgs[k].cz}</b><br><em>${D.orgs[k].la}</em></button>`).join('')}</div>
    ${qa.done?`<div class="fb"><div class="note"><b>${o.cz} (${o.la})</b>${sp.length?'<br>na obrázcích: '+sp.map(esc).join(', '):''}</div></div>`:''}</div>
    <div class="ctl"><button class="b" id="nx" ${qa.done?'':'disabled'}>Další otázka →</button></div>`;
    m.querySelectorAll('.ci').forEach(b=>b.onclick=()=>openLb(c,+b.dataset.z));
    m.querySelectorAll('.o').forEach(b=>b.onclick=()=>{qa.done=b.dataset.k;score.t++;if(b.dataset.k==c.o){score.r++;st[c.o]='k'}else st[c.o]='n';save();render()});
    $('#nx').onclick=()=>go(1);
  }
  prog();preload();
}
function preload(){const n=deck[(i+1)%deck.length];if(n&&typeof IM=='undefined')n.im.forEach(x=>loadPack(D.P[x.i][0]))}
function doFlip(){flip=!flip;$('#cd')&&$('#cd').classList.toggle('f',flip)}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;qa=null;render();window.scrollTo({top:Math.min(window.scrollY,$('#main').offsetTop-8)})}
function mark(v){const c=deck[i];st[c.o]=v;save();if(unk&&v=='k'){build()}else go(1)}
/* zvětšení */
let L=null;
function revealed(){return mode=='c'?flip:!!(qa&&qa.done)}
function openLb(c,j){L={c,j,z:1};$('#lb').hidden=false;document.body.style.overflow='hidden';lbShow()}
function closeLb(){L=null;$('#lb').hidden=true;document.body.style.overflow=''}
function lbShow(){
  const c=L.c,n=c.im.length,x=c.im[L.j],o=D.orgs[c.o];
  const li=$('#lbi');li.dataset.i=x.i;li.src=SRC(x.i);$('#lbc').textContent=`Obrázek ${L.j+1} z ${n}`;
  const v=$('#lbv');v.classList.toggle('z',L.z>1);v.style.setProperty('--z',L.z);v.scrollTop=0;v.scrollLeft=0;
  if(L.z>1)requestAnimationFrame(()=>{v.scrollLeft=(v.scrollWidth-v.clientWidth)/2;v.scrollTop=(v.scrollHeight-v.clientHeight)/2});
  $('#lbl').style.display=$('#lbr').style.display=n>1?'':'none';
  let t='';if(revealed()){const cp=capOf(c,x);t=`<b>${o.cz}</b> <em>${o.la}</em>`+(cp.t?`<small>${cp.sp?esc(x.cz)+' ('+esc(x.la)+')'+(x.note?' · '+x.note:''):x.note}</small>`:'')}else t='<small>Popisek uvidíš po otočení kartičky.</small>';
  $('#lbt').innerHTML=t;
  $('#lbd').innerHTML=n>1?c.im.map((_,k)=>`<i class="${k==L.j?'on':''}"></i>`).join(''):'';
}
function lbGo(d){if(!L)return;const n=L.c.im.length;L.j=(L.j+d+n)%n;L.z=1;lbShow()}
function lbZoom(d){if(!L)return;L.z=Math.min(4,Math.max(1,L.z+d));lbShow()}
$('#lbx').onclick=closeLb;$('#lbl').onclick=()=>lbGo(-1);$('#lbr').onclick=()=>lbGo(1);
$('#lbp').onclick=()=>lbZoom(1);$('#lbm').onclick=()=>lbZoom(-1);
$('#lbv').addEventListener('click',e=>{if(e.target===$('#lbv')&&L.z==1)closeLb()});
$('#lbi').addEventListener('dblclick',()=>{L.z=L.z>1?1:2.5;lbShow()});
(()=>{let sx=0,sy=0,t0=0,last=0,multi=false;const v=$('#lbv');
  v.addEventListener('touchstart',e=>{multi=e.touches.length>1;const p=e.touches[0];sx=p.clientX;sy=p.clientY;t0=Date.now()},{passive:true});
  v.addEventListener('touchend',e=>{if(!L||multi)return;const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy,now=Date.now();
    if(Math.abs(dx)<10&&Math.abs(dy)<10){if(now-last<320&&e.target===$('#lbi')){e.preventDefault();L.z=L.z>1?1:2.5;lbShow();last=0;return}last=now;return}
    if(L.z==1&&now-t0<600){if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)lbGo(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx)*1.5)closeLb()}});
})();
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.s){sec=t.dataset.s;org='all';i=0;score={r:0,t:0};try{localStorage.setItem('prot_sec',sec)}catch(e){};build()}
  if(t.dataset.o){org=t.dataset.o;i=0;build()}
  if(t.dataset.m){mode=t.dataset.m;document.querySelectorAll('.tab[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));i=0;score={r:0,t:0};build()}
});
$('#sh').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf);i=0;build()};
$('#un').onclick=e=>{unk=!unk;e.currentTarget.classList.toggle('on',unk);i=0;build()};
let rsT;$('#rs').onclick=e=>{const b=e.currentTarget;if(!b.dataset.c){b.dataset.c=1;b.textContent='Opravdu vynulovat?';b.classList.add('on');rsT=setTimeout(()=>{delete b.dataset.c;b.textContent='Vynulovat';b.classList.remove('on')},3000);return}clearTimeout(rsT);delete b.dataset.c;b.textContent='Vynulovat';b.classList.remove('on');st={};save();score={r:0,t:0};build()};
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme=='dark';r.dataset.theme=d?'light':'dark'};
document.addEventListener('keydown',e=>{
  if(L){if(e.key=='Escape')closeLb();else if(e.key=='ArrowRight')lbGo(1);else if(e.key=='ArrowLeft')lbGo(-1);else if(e.key=='+'||e.key=='=')lbZoom(1);else if(e.key=='-')lbZoom(-1);return}
  if(e.target.tagName=='SELECT')return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);
  else if(mode=='c'&&(e.key==' '||e.key=='Enter')){e.preventDefault();doFlip()}
  else if(mode=='c'&&e.key.toLowerCase()=='j')mark('k');else if(mode=='c'&&e.key.toLowerCase()=='n')mark('n');
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(deck.length){const f=flip;render();if(f){flip=true;$('#cd')&&$('#cd').classList.add('f')}}},200)});
build();
</script></body></html>
